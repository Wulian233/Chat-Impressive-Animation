architectury {
    platformSetupLoomIde()
    forge()
}

base {
    archivesName = rootProject.archives_base_name + "-forge"
}

loom {
	forge {
		mixinConfigs("chatimpressiveanimation.mixins.json")
	}
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
	modApi "me.shedaniel.cloth:cloth-config-forge:${rootProject.clothconfig_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
	shadowBundle(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"

	configurations = [project.configurations.shadowBundle]
    archiveClassifier.set("dev-shadow")
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
