architectury {
	platformSetupLoomIde()
	neoForge()
}

base {
	archivesName = rootProject.archives_base_name + "-neoforge"
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common

	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

repositories {
	maven { url = "https://maven.neoforged.net/releases/" }
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
	implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.clothconfig_version}"

	common(project(path: ":common", configuration: "runtimeElements")) { transitive = false }
	shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": project.version
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier.set("dev-shadow")
}

jar {
	archiveClassifier.set(null)
}

sourcesJar {
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}
