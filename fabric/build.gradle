architectury {
	platformSetupLoomIde()
	fabric()
}

base {
	archivesName = rootProject.archives_base_name + "-fabric"
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common

	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

repositories {
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
	implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	implementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.clothconfig_version}"
	implementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}") { transitive = false }

	common(project(path: ":common", configuration: "runtimeElements")) { transitive = false }
	shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier.set("dev-shadow")
}

jar {
	archiveClassifier.set(null)
}

sourcesJar {
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}
